<html lang="en">

<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}

.side{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}

.i.back{display:none}

.rb{display:none;justify-content:space-between;align-items:center;padding:6px 16px;background:var(--card);border-top:1px solid var(--line);color:var(--mut);font-size:13px}
.empty{margin:auto;text-align:center;color:var(--mut);padding:30px;display:flex;flex-direction:column;gap:12px;align-items:center}.empty .big{font-size:46px;font-weight:800;color:var(--acc);letter-spacing:-1.5px}
.ov{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:9}

.lb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000d}.lb>div{background:none;padding:0;width:auto;max-height:none;flex-direction:row}.lb img{max-width:92vw;max-height:76vh;border-radius:12px;object-fit:contain}.foot{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px}.vbtn{background:none;color:var(--mut);font-size:13px;font-weight:500;padding:6px 12px}.vbtn:hover{background:var(--line)}.m img{cursor:zoom-in}

.et{display:flex;gap:2px;overflow:auto}.et button,.eg button{background:none;padding:4px 8px;font-size:22px;border-radius:10px;line-height:1.2}

.pl{display:flex;flex-direction:column;gap:6px;min-width:220px}.po{position:relative;border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;overflow:hidden;font-size:14px;color:var(--ink);background:var(--card)}.po i{position:absolute;left:0;top:0;bottom:0;background:var(--mine);opacity:.8}.po span{position:relative}.po.v{border-color:var(--acc)}
.sw{display:flex;align-items:center;gap:8px}.sw input{width:18px;height:18px;padding:0}
.hb{display:flex;justify-content:center;gap:4px;padding:6px 8px;background:var(--card);border-top:1px solid var(--line)}.hb button{background:none;padding:4px 10px;font-size:22px;border-radius:12px;line-height:1.2}.hb button:hover{background:var(--bg)}
img.av{object-fit:cover}
.tx{white-space:pre-wrap;word-break:break-word}.tx.big{font-size:40px;line-height:1.2}.tx a{color:inherit;text-decoration:underline}.once{font-weight:600}
.dsep{align-self:center;color:var(--mut);font-size:12px;margin:10px 0 4px}
@media(max-width:640px){#app{grid-template-columns:1fr}#app.c .side,#app:not(.c):not(.p) .main{display:none}.i.back{display:grid}}
</style>

<script>

{v:'1.6.0',date:'2026-11-11',notes:['Now simply called Yap','Find people by typing their full username','Public and private accounts: private accounts approve chat requests first (Settings > Privacy)','Profile view with real name, status, block and report','Group tools: rename, remove people, Close group, and a new owner if the creator leaves','Unread badges, chats sorted by latest message, and last-message time','Admin: reports screen']},

{v:'1.4.1',date:'2026-11-10',notes:['Themes: Sky blue, Pink, Purple, Green and Yellow, chosen in Settings','Light, Dark or Auto (follows your device) switch','Your look is saved on each device; a new device starts with Sky blue and your device setting']},

{v:'1.2.0',date:'2026-11-08',notes:['New look: two-panel layout that fits any screen','Install it as an app from your browser (Add to Home Screen)','Reactions: double-tap for your first favourite, long-press for all five','Your own 5-emoji hotbar in Settings, synced to your account','Emoji keyboard (the 😭 button) with hundreds of emojis','Floating 💀 😭 💅 and confetti 🎉, with soft sounds you can turn off','Typing indicator, profile pictures, swipe right to reply','Group photos, and the group creator can add people later','Tap an image to open it and save it','Read messages disappear after 5 hours unless kept','Changelog lives under the version number in Settings']},
{v:'1.1.0',date:'2026-11-08',notes:['New two-panel layout with a roomier chat view','Settings is now a full page, and you can change your name and username in the app','Find people by typing their name or username, no full list','Nicer buttons and message bubbles','Pop-ups replaced with in-app forms','Full-width layout that fits any screen, like Instagram DMs','Admin button right on the main screen','Tap an image to open it full screen and save it (on iPhone and iPad it goes to your photos)','Changelog now opens from the version number at the bottom of Settings']},
{v:'1.0.1',date:'2026-11-08',notes:['Fixed a stray "false" under the search bar']},
{v:'1.0.0',date:'2026-11-08',notes:['First Yap release']}];

const root=document.getElementById('app');
function h(t,p={},...k){const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a.startsWith('on'))e[a]=v;else if(v!=null&&v!==false)e.setAttribute(a,v)}for(const c of k.flat())if(c!=null&&c!==false&&c!==0)e.append(c.nodeType?c:document.createTextNode(c));return e}
const S={cur:null,uid:null,sound:true,hot:['👍','❤️','😂','😮','😢'],users:{},chats:[],blocked:new Set(),reqs:[]};
const SBU='https://wbbxlwvxvsynpxmiobfg.supabase.co';
const sb=supabase.createClient(SBU,'sb_publishable_0QHh-5IBoVPO7CmTZ7_u7A_sBn3YjCW');
const K=id=>id===S.uid?'me':id;
const pubUrl=p=>sb.storage.from('avatars').getPublicUrl(p).data.publicUrl;
async function fn(name,body,auth){
  const hd={'Content-Type':'application/json',apikey:'sb_publishable_0QHh-5IBoVPO7CmTZ7_u7A_sBn3YjCW'};
  if(auth){const{data}=await sb.auth.getSession();hd.Authorization='Bearer '+data.session.access_token}
  try{const r=await fetch(SBU+'/functions/v1/'+name,{method:'POST',headers:hd,body:JSON.stringify(body)});return{ok:r.ok,d:await r.json().catch(()=>({}))}}

}
const adm=b=>fn('admin-users',b,true);
function setU(p){S.users[K(p.id)]={id:p.id,username:p.username,display:p.display_name,real:p.admin_name,admin:p.is_admin,on:p.is_active,pic:p.avatar_path?pubUrl(p.avatar_path):null,ap:p.avatar_path,status:p.status||'',priv:!!p.is_private}}
async function loadAll(){
  const{data:cm}=await sb.from('conversation_members').select('conversation_id,user_id,conversations(id,is_group,name,image_path,created_by,created_at)');
  const by={};for(const r of cm||[])(by[r.conversation_id]=by[r.conversation_id]||{c:r.conversations,uids:[]}).uids.push(r.user_id);
  const ids=[...new Set((cm||[]).map(r=>r.user_id).concat(S.uid))];
  const{data:ps}=await sb.from('profiles').select('*').in('id',ids);(ps||[]).forEach(setU);ids.forEach(i=>{const k=K(i);if(!S.users[k])S.users[k]={id:i,username:'unknown',display:'Unknown user',on:false}});
  const old=Object.fromEntries(S.chats.map(c=>[c.id,c]));
  S.chats=Object.values(by).filter(x=>x.c).map(x=>Object.assign(old[x.c.id]||{msgs:[]},{id:x.c.id,group:x.c.is_group,name:x.c.name,img:x.c.image_path?pubUrl(x.c.image_path):null,imgp:x.c.image_path,creator:x.c.created_by,created:new Date(x.c.created_at),uids:x.uids,members:x.uids.map(K)}));
  await Promise.all(S.chats.map(loadMsgs));
  const rqr=await sb.rpc('my_requests');S.reqs=rqr.data||[];const bl=await sb.from('blocks').select('blocked_id');S.blocked=new Set((bl.data||[]).map(r=>r.blocked_id));
  if(S.users.me&&S.users.me.admin){const r=await sb.from('reset_requests').select('id',{count:'exact',head:true}).eq('status','open');const r2=await sb.from('reports').select('id',{count:'exact',head:true}).eq('status','open');S.reqN=(r.count||0)+(r2.count||0)}
}
async function loadMsgs(c){
  const{data:ms}=await sb.from('messages').select('*').eq('conversation_id',c.id).order('created_at');
  const L=(ms||[]).filter(m=>new Date(m.delete_at)>new Date()),ids=L.map(m=>m.id);
  const[a,b,pl,po,pst]=ids.length?await Promise.all([sb.from('message_reads').select('message_id,user_id').in('message_id',ids),sb.from('reactions').select('*').in('message_id',ids),sb.from('polls').select('*').in('message_id',ids),sb.from('poll_options').select('*').in('message_id',ids).order('idx'),sb.rpc('poll_state',{mids:ids})]):[{data:[]},{data:[]},{data:[]},{data:[]},{data:[]}];
  const ov=ids.length?await sb.from('once_views').select('message_id').in('message_id',ids):{data:[]};const seen=new Set((ov.data||[]).map(r=>r.message_id));const paths=L.filter(m=>m.image_path&&!m.view_once).map(m=>m.image_path),urls={};
  if(paths.length){const{data}=await sb.storage.from('chat-images').createSignedUrls(paths,3600);(data||[]).forEach(d=>{if(d.signedUrl)urls[d.path]=d.signedUrl})}
  const rc={},rxm={},myr=new Set();(a.data||[]).forEach(r=>{rc[r.message_id]=(rc[r.message_id]||0)+1;if(r.user_id===S.uid)myr.add(r.message_id)});(b.data||[]).forEach(r=>{(rxm[r.message_id]=rxm[r.message_id]||{})[K(r.user_id)]=r.emoji});
  const PL={};(pl.data||[]).forEach(p=>{PL[p.message_id]={anon:p.anon,change:p.allow_change,rev:p.revealed,o:[],total:0}});
  (po.data||[]).forEach(o=>{if(PL[o.message_id])PL[o.message_id].o.push({id:o.id,t:o.label,n:null,v:[]})});
  (pst.data||[]).forEach(r=>{const p=PL[r.message_id];if(!p)return;const o=p.o.find(x=>x.id===r.option_id);if(!o)return;o.n=r.n;o.v=(r.voters||[]).map(K);p.total=r.total;if(r.mine)p.my=o.id});
  c.msgs=L.map(m=>({id:m.id,from:K(m.sender_id),text:PL[m.id]?null:m.body,img:urls[m.image_path]||null,path:m.image_path,t:new Date(m.created_at),read:(rc[m.id]||0)>=c.uids.length-1,reply:m.reply_to,ttl:m.ttl_seconds,kept:m.kept_by?K(m.kept_by):null,rx:rxm[m.id],mr:myr.has(m.id),once:m.view_once,seen:seen.has(m.id),poll:PL[m.id]&&Object.assign(PL[m.id],{q:m.body})}));

async function refreshAll(){

  let nw=null;S.chats.forEach(c=>c.msgs.forEach(m=>{if(!old.has(m.id)&&m.from!=='me'&&S.ready)nw=m}));if(nw){beep(520);if(Date.now()-nw.t<30000)fx(nw.text)}
  const c=S.chats.find(x=>x.id===S.cur);if(c){if(S.draw)S.draw();markRead(c.id)}sideRefresh();
}
let rt;const live=()=>{clearTimeout(rt);rt=setTimeout(refreshAll,250)};
let tt=0;function typing(c){const n=Date.now();if(n-tt<2000||!S.ch)return;tt=n;S.ch.send({type:'broadcast',event:'typing',payload:{c:c.id,u:S.uid}})}
function typingIn(p){const c=S.chats.find(x=>x.id===p.c);if(!c)return;c.typing=K(p.u);if(S.cur===c.id&&S.draw)S.draw();clearTimeout(c.tt);c.tt=setTimeout(()=>{c.typing=null;if(S.cur===c.id&&S.draw)S.draw()},3000)}

const cav=(c,n)=>c.group&&c.img?h('img',{class:'av',src:c.img,alt:'',style:`width:${n}px;height:${n}px`}):av(title(c),n,c.group?null:other(c));

  return h('div',{class:'card'},h('h2',{style:'margin-top:0'},'Emoji hotbar'),h('div',{class:'mut'},'Tap a slot, then pick an emoji for it. These are your quick reactions.'),row,pan,m);
}
function groupInfo(c){
  const mine=c.creator===S.uid,pf=h('input',{type:'file',accept:'image/*',style:'display:none'}),q=h('input',{type:'text',placeholder:'Add someone by full username',autocapitalize:'none'}),er=h('div',{class:'er'}),rn=h('input',{type:'text',value:c.name||'',maxlength:40});

    h('div',{class:'foot'},h('button',{class:'vbtn',onclick:e=>{const p=document.getElementById('cl'),open=p.style.display==='none';p.style.display=open?'flex':'none';e.currentTarget.textContent='Yap v'+VERSION+(open?' ▴':' ▾');if(open)p.scrollIntoView({behavior:'smooth',block:'end'})}},'Yap v'+VERSION+' ▾'),
      h('div',{id:'cl',class:'card',style:'display:none;width:100%'},...CHANGELOG.map(c=>h('div',{},h('b',{},'v'+c.v+' · '+c.date),h('ul',{style:'margin:4px 0 0;padding-left:18px'},...c.notes.map(n=>h('li',{},n))))))))));

async function admin(msg){
  root.className='p';
  const{data:ps}=await sb.from('profiles').select('*').order('created_at');
  const{data:ns}=await sb.from('admin_notes').select('*');const{data:us}=await sb.rpc('admin_usage');const{data:rqs}=await sb.from('reset_requests').select('*').eq('status','open');const{data:rps}=await sb.from('reports').select('*').eq('status','open').order('created_at',{ascending:false});const N=Object.fromEntries((ns||[]).map(x=>[x.user_id,x.notes]));
  const rn=h('input',{type:'text',placeholder:'Real name'}),ru=h('input',{type:'text',placeholder:'Username (blank = automatic)',autocapitalize:'none'}),rt=h('input',{type:'text',placeholder:'Notes (only you see these)'}),er=h('div',{class:'er'});
  const rows=(ps||[]).filter(p=>!p.is_admin).map(p=>h('div',{class:'card'},
    h('div',{style:'display:flex;align-items:center;gap:12px'},av(p.display_name||p.username,40),h('div',{class:'t2'},h('b',{},(p.admin_name||p.username)+(p.is_active?'':' (off)')+(p.password_set?'':' · no password yet')),h('small',{},'@'+p.username+(N[p.id]?' · '+N[p.id]:'')))),
    h('div',{class:'acts',style:'justify-content:flex-start'},
      h('button',{class:'s',onclick:()=>{const a=h('input',{type:'text',value:p.username}),b=h('input',{type:'text',value:p.admin_name||''}),c=h('input',{type:'text',value:N[p.id]||''}),e=h('div',{class:'er'});const o=modal(h('h3',{},'Edit user'),a,b,c,e,h('div',{class:'acts'},h('button',{class:'s',onclick:()=>o.remove()},'Cancel'),h('button',{onclick:async()=>{const r=await adm({action:'update',user_id:p.id,username:a.value.trim(),admin_name:b.value.trim(),notes:c.value.trim()});if(!r.ok)return e.textContent=r.d.error||'Failed';o.remove();admin('Saved')}},'Save')))}},'Edit'),
      h('button',{class:'s',onclick:async()=>{if(await ask('Reset password for '+p.username+'?','Reset')){const r=await adm({action:'reset_password',user_id:p.id});admin(r.ok?'Reset done. They pick a new password next time they sign in.':r.d.error)}}},'Reset password'),
      h('button',{class:'s',onclick:async()=>{await adm({action:p.is_active?'deactivate':'reactivate',user_id:p.id});admin(p.is_active?'Deactivated':'Reactivated')}},p.is_active?'Deactivate':'Reactivate'),
      h('button',{class:'s',onclick:async()=>{if(await ask('Delete '+p.username+' and all their messages forever?','Delete',1)){await adm({action:'delete',user_id:p.id});admin('Deleted')}}},'Delete'))));

    reqCard(rqs,ps),reportsCard(rps,ps),usageCard(us),h('div',{class:'card'},h('h2',{style:'margin-top:0'},'Create a user'),rn,ru,rt,h('button',{onclick:async()=>{if(!rn.value.trim())return er.textContent='Enter their real name.';const r=await adm({action:'create',admin_name:rn.value.trim(),username:ru.value.trim(),notes:rt.value.trim()});if(!r.ok)return er.textContent=r.d.error||'Failed';admin('Created. Give them the username: '+r.d.user.username)}},'Create user'),er),
    msg&&h('div',{class:'ok'},msg),...rows)));

applyTheme();boot();
</script>
